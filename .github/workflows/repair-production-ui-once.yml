name: One-shot production UI repair

on:
  push:
    branches:
      - agent/rust-gui-encrypted-transfer
    paths:
      - ".github/workflows/repair-production-ui-once.yml"
      - "rust/crates/lpac-relay-backend/src/lib.rs"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/rust-gui-encrypted-transfer
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Replace global bootstrap state with window-owned state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("rust/apps/lpac-gui/src/bin/nik-lpa.rs")
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              "    peer_code_input: String,\n    peer: Option<PeerIdentity>,",
              "    peer_code_input: String,\n    server_bootstrap_input: String,\n    peer: Option<PeerIdentity>,",
          )
          source = source.replace(
              "            peer_code_input: String::new(),\n            peer: None,",
              "            peer_code_input: String::new(),\n            server_bootstrap_input: String::new(),\n            peer: None,",
          )
          source = source.replace(
              "        self.peer_code_input.zeroize();\n",
              "        self.peer_code_input.zeroize();\n        self.server_bootstrap_input.zeroize();\n",
          )

          obsolete_import_branch = '''        if self.mode == AppMode::ServerAgent && self.session.is_none() {
              let incoming_text = self.pending_server_incoming_text().unwrap_or_default();
              let packet: RelayPacket = match self.identity.decrypt(&peer, incoming_text.trim()) {
                  Ok(packet) => packet,
                  Err(error) => {
                      self.add_log(format!("ПОМИЛКА розшифрування INIT_REQUEST: {error}"));
                      return;
                  }
              };
              if packet.stage != RelayStage::InitRequest {
                  self.add_log(format!(
                      "ПОМИЛКА: Server Agent очікує INIT_REQUEST, отримано {}",
                      packet.stage.code()
                  ));
                  return;
              }
              match RelaySession::new_server(packet) {
                  Ok(mut session) => {
                      session.timeline.push(model::TimelineEntry {
                          stage: RelayStage::InitRequest,
                          timestamp: Utc::now(),
                          packet_size: incoming_text.trim().len(),
                          note: "Отримано, розшифровано та перевірено".into(),
                      });
                      self.session = Some(session);
                      self.process_server_init_request();
                  }
                  Err(error) => self.add_log(format!("ПОМИЛКА INIT_REQUEST: {error}")),
              }
              return;
          }

          '''
          if obsolete_import_branch not in source:
              raise SystemExit("obsolete server bootstrap branch not found")
          source = source.replace(obsolete_import_branch, "")

          obsolete_helper = '''    fn pending_server_incoming_text(&self) -> Option<&str> {
              self.session
                  .as_ref()
                  .map(|session| session.incoming_text.as_str())
                  .or_else(|| self.log.front().and(None))
          }

          '''
          if obsolete_helper not in source:
              raise SystemExit("obsolete bootstrap helper not found")
          source = source.replace(obsolete_helper, "")

          block_start = source.index(
              "        if self.mode == AppMode::ServerAgent && self.session.is_none() && self.relay_running {"
          )
          block_end = source.index("\n        let Some(session) = self.session.as_mut() else {", block_start)
          replacement = '''        if self.mode == AppMode::ServerAgent && self.session.is_none() && self.relay_running {
              let mut accept_bootstrap = false;
              card(ui, |ui| {
                  ui.heading("Вхідний INIT_REQUEST");
                  ui.label("Вставте NIKRSP2 строку, створену Card Agent.");
                  ui.add(
                      egui::TextEdit::multiline(&mut self.server_bootstrap_input)
                          .desired_rows(8)
                          .desired_width(f32::INFINITY)
                          .font(egui::TextStyle::Monospace),
                  );
                  accept_bootstrap = ui
                      .add_enabled(
                          !self.busy && !self.server_bootstrap_input.trim().is_empty(),
                          egui::Button::new("Прийняти INIT_REQUEST"),
                      )
                      .clicked();
              });

              if accept_bootstrap {
                  let text = std::mem::take(&mut self.server_bootstrap_input);
                  let peer = match self.peer {
                      Some(peer) => peer,
                      None => {
                          self.add_log("ПОМИЛКА: peer не спарений");
                          return;
                      }
                  };
                  match self.identity.decrypt::<RelayPacket>(&peer, text.trim()) {
                      Ok(packet) if packet.stage == RelayStage::InitRequest => {
                          match RelaySession::new_server(packet) {
                              Ok(mut session) => {
                                  session.timeline.push(model::TimelineEntry {
                                      stage: RelayStage::InitRequest,
                                      timestamp: Utc::now(),
                                      packet_size: text.trim().len(),
                                      note: "Отримано, розшифровано та перевірено".into(),
                                  });
                                  self.session = Some(session);
                                  self.process_server_init_request();
                              }
                              Err(error) => {
                                  self.add_log(format!("ПОМИЛКА INIT_REQUEST: {error}"))
                              }
                          }
                      }
                      Ok(packet) => self.add_log(format!(
                          "ПОМИЛКА: очікувався INIT_REQUEST, отримано {}",
                          packet.stage.code()
                      )),
                      Err(error) => self.add_log(format!("ПОМИЛКА розшифрування: {error}")),
                  }
              }
              return;
          }
          '''
          source = source[:block_start] + replacement + source[block_end:]
          path.write_text(source, encoding="utf-8")
          PY

      - name: Format Rust workspace
        working-directory: rust
        run: cargo fmt --all

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "UI already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/apps/lpac-gui/src/bin/nik-lpa.rs
          git commit -m "Replace global relay bootstrap with window-owned state"
          git push origin HEAD:agent/rust-gui-encrypted-transfer
