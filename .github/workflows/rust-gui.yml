name: Rust GUI Windows

on:
  push:
    paths:
      - "rust/**"
      - "src/**"
      - "utils/**"
      - ".github/workflows/rust-gui.yml"
  pull_request:
    paths:
      - "rust/**"
      - "src/**"
      - "utils/**"
      - ".github/workflows/rust-gui.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up native Windows UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust workspace
        working-directory: rust
        run: cargo build --workspace --all-targets

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --workspace

      - name: Build release GUI
        working-directory: rust
        run: cargo build --release -p lpac-gui

      - name: Build native Windows lpac runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build-lpac-windows -G Ninja \
            -DSTANDALONE_MODE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DLPAC_WITH_HTTP_CURL=OFF
          cmake --build build-lpac-windows
          rm -rf native-stage desktop-bundle
          cmake --install build-lpac-windows --prefix "$PWD/native-stage"
          test -d native-stage/executables
          mkdir -p desktop-bundle
          cp -a native-stage/executables/. desktop-bundle/

          cp -f /ucrt64/bin/libgcc_s_seh-1.dll desktop-bundle/
          cp -f /ucrt64/bin/libwinpthread-1.dll desktop-bundle/

          test -f desktop-bundle/libgcc_s_seh-1.dll
          test -f desktop-bundle/libwinpthread-1.dll

      - name: Assemble Windows desktop bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force desktop-bundle/driver | Out-Null
          Get-ChildItem desktop-bundle -Filter "driver_*.dll" | Copy-Item -Destination desktop-bundle/driver -Force
          Copy-Item rust/target/release/lpac-gui.exe desktop-bundle/nik-lpa-gui.exe
          Copy-Item rust/README.md desktop-bundle/NIK-LPA-README.md
          @'
          @echo off
          cd /d "%~dp0"
          set "PATH=%CD%;%CD%\lib;%SystemRoot%\System32;%SystemRoot%"
          ".\nik-lpa-gui.exe"
          '@ | Set-Content -Encoding ascii desktop-bundle/run-nik-lpa.cmd

      - name: Smoke-test isolated Windows desktop bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "desktop-bundle/lpac.exe",
            "desktop-bundle/nik-lpa-gui.exe",
            "desktop-bundle/libgcc_s_seh-1.dll",
            "desktop-bundle/libwinpthread-1.dll",
            "desktop-bundle/driver/driver_apdu_pcsc.dll",
            "desktop-bundle/driver/driver_apdu_stdio.dll",
            "desktop-bundle/driver/driver_http_stdio.dll",
            "desktop-bundle/driver/driver_http_winhttp.dll",
            "desktop-bundle/run-nik-lpa.cmd"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing bundle file: $path"
            }
          }

          Push-Location desktop-bundle
          try {
            $env:PATH = "$PWD;$env:SystemRoot\System32;$env:SystemRoot"
            $env:LPAC_APDU = "stdio"
            $env:LPAC_HTTP = "stdio"
            & .\lpac.exe version
            if ($LASTEXITCODE -ne 0) {
              throw "Bundled lpac.exe failed in an isolated runtime environment"
            }
          } finally {
            Pop-Location
          }

      - name: Upload Windows desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: nik-lpa-desktop-windows-x86_64
          if-no-files-found: error
          path: desktop-bundle
