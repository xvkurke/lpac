name: Add production audit timeline once

on:
  push:
    branches:
      - agent/rust-gui-encrypted-transfer
    paths:
      - ".github/workflows/add-audit-timeline-once.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/rust-gui-encrypted-transfer
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Display real audit timeline entries
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("rust/apps/lpac-gui/src/bin/nik_lpa/views.rs")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "use lpac_core::relay::{RelayPacket, RelayStage};",
              "use lpac_core::relay::RelayStage;",
          )
          needle = '''                });
              if let Some(session) = self.session.as_ref() {
                  ui.separator();
                  ui.label(format!("Job ID: {}", session.job_id));
          '''
          replacement = '''                });
              if let Some(session) = self.session.as_ref() {
                  if !session.timeline.is_empty() {
                      ui.separator();
                      ui.strong("Audit подій");
                      egui::Grid::new("rsp_audit_timeline")
                          .num_columns(4)
                          .spacing([12.0, 6.0])
                          .striped(true)
                          .show(ui, |ui| {
                              ui.strong("Час UTC");
                              ui.strong("Стадія");
                              ui.strong("Розмір");
                              ui.strong("Результат");
                              ui.end_row();
                              for event in &session.timeline {
                                  ui.monospace(event.timestamp.format("%H:%M:%S").to_string());
                                  ui.monospace(event.stage.code());
                                  ui.label(format!("{} байт", event.packet_size));
                                  ui.label(&event.note);
                                  ui.end_row();
                              }
                          });
                  }
                  ui.separator();
                  ui.label(format!("Job ID: {}", session.job_id));
          '''
          if needle not in source:
              raise SystemExit("timeline insertion point not found")
          source = source.replace(needle, replacement, 1)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Format Rust workspace
        working-directory: rust
        run: cargo fmt --all
      - name: Commit audit timeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/apps/lpac-gui/src/bin/nik_lpa/views.rs
          git commit -m "Display verified relay audit timeline"
          git push origin HEAD:agent/rust-gui-encrypted-transfer
