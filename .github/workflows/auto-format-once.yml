name: One-shot source formatter

on:
  push:
    branches:
      - agent/rust-gui-encrypted-transfer
    paths:
      - "src/**"
      - "rust/**"
      - ".github/workflows/auto-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/rust-gui-encrypted-transfer
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust workspace
        working-directory: rust
        run: cargo fmt --all

      - name: Format C sources
        uses: nicelabs/clang-format-action@main
        with:
          version: 20
          dry-run: false
          warnings-as-errors: false

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src rust
          git commit -m "Apply automated source formatting"
          git push origin HEAD:agent/rust-gui-encrypted-transfer
