name: Embed Roboto source

on:
  push:
    paths:
      - ".github/workflows/embed-roboto.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/rust-gui-encrypted-transfer

      - name: Download official Roboto and generate Rust source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/google/fonts/raw/refs/heads/main/ofl/roboto/Roboto%5Bwdth%2Cwght%5D.ttf' \
            --output /tmp/Roboto.ttf
          python - <<'PY'
          import base64
          from pathlib import Path

          data = Path('/tmp/Roboto.ttf').read_bytes()
          if len(data) < 100_000:
              raise SystemExit('Roboto download is unexpectedly small')
          encoded = base64.b64encode(data).decode('ascii')
          chunks = [encoded[i:i + 100] for i in range(0, len(encoded), 100)]
          out = Path('rust/apps/lpac-gui/src/bin/nik_lpa/roboto_data.rs')
          lines = [
              '// SPDX-FileCopyrightText: 2011 The Roboto Project Authors (https://github.com/googlefonts/roboto-classic)',
              '// SPDX-License-Identifier: OFL-1.1',
              '',
              '// Generated from Google Fonts ofl/roboto/Roboto[wdth,wght].ttf.',
              '// Keep the font embedded in source so the Windows bundle has no runtime font dependency.',
              'pub const ROBOTO_BASE64: &str = concat!(',
          ]
          lines.extend(f'    "{chunk}",' for chunk in chunks)
          lines.append(');')
          lines.append('')
          out.write_text('\n'.join(lines), encoding='utf-8')
          print(f'Generated {out}: {len(data)} font bytes, {len(encoded)} base64 chars')
          PY

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/apps/lpac-gui/src/bin/nik_lpa/roboto_data.rs
          if git diff --cached --quiet; then
            echo 'Roboto source already up to date'
            exit 0
          fi
          git commit -m 'ui: embed Roboto font data'
          git push origin HEAD:agent/rust-gui-encrypted-transfer
