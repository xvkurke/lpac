name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [v*]
    paths-ignore:
      - docs
  pull_request:
    branches: [main]
    paths-ignore:
      - docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CFLAGS: "-Werror"

jobs:
  build:
    name: Build for Windows with MinGW
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Windows cross-build toolchain
        run: .github/scripts/setup-debian.sh mingw

      - name: Build Windows x86_64 runtime
        run: .github/scripts/build-ci.sh mingw

      - name: Get short SHA
        run: echo "SHA7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: Upload Windows x86_64 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpac-${{ env.SHA7 }}-windows-x64
          path: ${{ github.workspace }}/build/*.*

  release:
    name: Release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          pattern: "*"
      - name: Run SHA1SUM
        id: checksum
        run: |
          echo 'sha1sum<<EOF' >> $GITHUB_OUTPUT
          sha1sum * >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ```plain
            ${{ steps.checksum.outputs.sha1sum }}
            ```
          append_body: true
          files: "*"
